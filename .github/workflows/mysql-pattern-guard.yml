name: MySQL Pattern Guard

on:
  pull_request:
    branches:
      - main
      - develop
      - "**"
  workflow_dispatch:

jobs:
  mysql-pattern-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run MySQL pattern scan
        run: npm run check:mysql-patterns
